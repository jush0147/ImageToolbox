name: Markit Runtime Smoke Reuse

on:
  push:
    paths:
      - '.github/workflows/markit-smoke-reuse.yml'
      - '.github/scripts/markit-emulator-smoke.sh'
  workflow_dispatch:

concurrency:
  group: markit-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Reuse latest-source x86_64 candidate APK
        uses: actions/download-artifact@v4
        with:
          name: markit-x86-candidate
          path: app/build/outputs/apk/foss/debug
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36755440314

      - name: Confirm reused candidate
        run: |
          ls -lh app/build/outputs/apk/foss/debug
          test -n "$(find app/build/outputs/apk/foss/debug -name '*x86_64*.apk' | head -n 1)"

      - name: Enable KVM when available
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm || true
            ls -l /dev/kvm
          else
            echo "No /dev/kvm on this runner; emulator will use software acceleration."
          fi

      - name: Run reused-candidate runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/markit-emulator-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markit-runtime-smoke-evidence
          path: build/markit-smoke/
          if-no-files-found: warn
