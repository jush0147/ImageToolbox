name: Quick Markup CI

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: quick-markup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Fastest useful gate first: if Markit cannot survive real Android runtime,
      # do not spend time producing arm64 or release artifacts.
      - name: Build x86_64 FOSS debug APK for emulator
        run: ./gradlew :app:assembleFossDebug -PquickMarkupAbi=x86_64 --stacktrace
      - name: Run Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/markit-emulator-smoke.sh
      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markit-emulator-smoke
          path: build/markit-smoke/
          if-no-files-found: warn

      # Only after runtime is proven alive do the slower verification/artifact work.
      - name: Run FOSS draw tests
        run: ./gradlew :feature:draw:testFossDebugUnitTest --stacktrace
      - name: Build arm64 FOSS debug APK
        run: ./gradlew :app:assembleFossDebug -PquickMarkupAbi=arm64-v8a --stacktrace
      - name: Verify required Markit runtime
        run: |
          APK=$(ls app/build/outputs/apk/foss/debug/*arm64-v8a*.apk | head -n 1)
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libtrickle.so"
          grep -q "ImagePickerMode.PhotoPickerSingle" feature/draw/src/main/java/com/t8rin/imagetoolbox/feature/draw/presentation/DrawContent.kt
      - name: Report debug APK size
        run: |
          ls -lh app/build/outputs/apk/foss/debug/*.apk
          du -b app/build/outputs/apk/foss/debug/*.apk
      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: markit-arm64-debug
          path: app/build/outputs/apk/foss/debug/*arm64-v8a*.apk
          if-no-files-found: error

  release-size:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Build arm64 FOSS release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dkotlin.daemon.jvm.options=-Xmx2g -Dorg.gradle.workers.max=2"
        run: ./gradlew :app:assembleFossRelease -PquickMarkupAbi=arm64-v8a --no-parallel --stacktrace
      - name: Report release APK size
        run: |
          ls -lh app/build/outputs/apk/foss/release/*.apk
          du -b app/build/outputs/apk/foss/release/*.apk
      - name: Build FOSS release AAB
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dkotlin.daemon.jvm.options=-Xmx2g -Dorg.gradle.workers.max=2"
        run: ./gradlew :app:bundleFossRelease --no-parallel --stacktrace
      - name: Report release AAB size
        run: |
          ls -lh app/build/outputs/bundle/fossRelease/*.aab
          du -b app/build/outputs/bundle/fossRelease/*.aab
      - name: Upload arm64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: markit-arm64-release
          path: app/build/outputs/apk/foss/release/*arm64-v8a*.apk
          if-no-files-found: error
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: markit-foss-release-aab
          path: app/build/outputs/bundle/fossRelease/*.aab
          if-no-files-found: error
