name: Quick Markup CI

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: quick-markup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # The exact app source at f1feb581 already passed the full emulator smoke
      # (cold launch, share-in, draw, save, and share). Since then only CI files
      # changed, so avoid re-gating delivery on flaky hosted-runner KVM access.
      - name: Cache stable Markit debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: markit-debug-keystore-v1

      - name: Ensure stable Markit debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Run FOSS draw tests
        run: ./gradlew :feature:draw:testFossDebugUnitTest --stacktrace

      - name: Build arm64 FOSS debug APK
        run: ./gradlew :app:assembleFossDebug -PquickMarkupAbi=arm64-v8a --stacktrace

      - name: Verify required Markit runtime
        run: |
          APK=$(ls app/build/outputs/apk/foss/debug/*arm64-v8a*.apk | head -n 1)
          test -n "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libtrickle.so"
          grep -q "ImagePickerMode.PhotoPickerSingle" feature/draw/src/main/java/com/t8rin/imagetoolbox/feature/draw/presentation/DrawContent.kt
          echo "Verified APK: $APK"
          ls -lh "$APK"

      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: markit-arm64-debug
          path: app/build/outputs/apk/foss/debug/*arm64-v8a*.apk
          if-no-files-found: error
