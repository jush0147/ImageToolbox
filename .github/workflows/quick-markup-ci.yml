name: Quick Markup CI

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: quick-markup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Run draw tests
        run: ./gradlew :feature:draw:test --stacktrace
      - name: Build arm64 FOSS debug APK
        run: ./gradlew :app:assembleFossDebug -PquickMarkupAbi=arm64-v8a --stacktrace
      - name: Report APK size
        run: |
          ls -lh app/build/outputs/apk/foss/debug/*.apk
          du -b app/build/outputs/apk/foss/debug/*.apk | tee apk-sizes.txt
      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: huazhongdian-arm64-debug
          path: |
            app/build/outputs/apk/foss/debug/*arm64-v8a*.apk
            apk-sizes.txt
          if-no-files-found: error
