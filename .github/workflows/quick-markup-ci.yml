name: Quick Markup CI

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: quick-markup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Run draw tests
        run: ./gradlew :feature:draw:test --stacktrace
      - name: Build FOSS debug APK
        run: ./gradlew :app:assembleFossDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: huazhongdian-debug
          path: app/build/outputs/apk/foss/debug/*.apk
